services:
  - type: web
    name: beanloyal-backend
    runtime: docker
    branch: main
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FIREBASE_PROJECT_ID
        value: loyalty-de0e1
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      # Email sign-in. Without SPRING_MAIL_HOST/SMTP_USERNAME/SMTP_PASSWORD and
      # AUTH_EMAIL_FROM, /api/v1/auth/register answers EMAIL_UNAVAILABLE.
      # SendGrid: host smtp.sendgrid.net, username "apikey", password the API key.
      # AUTH_EMAIL_FROM must be an address on a domain verified with the relay.
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
      - key: AUTH_EMAIL_PUBLIC_URL
        value: https://bean-backend-ejzg.onrender.com/api/v1/auth/email
