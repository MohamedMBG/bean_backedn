spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mail:
    # spring.mail.host is deliberately left unset here: Spring Boot only creates a
    # JavaMailSender once SPRING_MAIL_HOST is supplied, so an unconfigured
    # deployment fails fast with EMAIL_UNAVAILABLE instead of attempting delivery.
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${PORT:8080}

auth:
  email:
    from: ${AUTH_EMAIL_FROM:}
    public-url: ${AUTH_EMAIL_PUBLIC_URL:}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}
    json: ${FIREBASE_CREDENTIALS_JSON:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
