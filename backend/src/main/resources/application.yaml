spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mail:
    # spring.mail.host is deliberately left unset here: Spring Boot only creates a
    # JavaMailSender once SPRING_MAIL_HOST is supplied, so an unconfigured
    # deployment fails fast with EMAIL_UNAVAILABLE instead of attempting delivery.
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${PORT:8080}

auth:
  email:
    from: ${AUTH_EMAIL_FROM:}
    public-url: ${AUTH_EMAIL_PUBLIC_URL:}
    # Preferred transport. Hosts commonly block outbound SMTP ports (Render does so on
    # free instances), where an HTTPS provider API is the only route that reaches the
    # network. When set it replaces spring.mail; the sender must be verified in Brevo.
    brevo-api-key: ${BREVO_API_KEY:}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}
    json: ${FIREBASE_CREDENTIALS_JSON:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # The auto-configured mail indicator opens an SMTP connection to spring.mail.host on every
    # health check. Hosts that block outbound SMTP (Render free) fail that probe, which drags the
    # aggregate /actuator/health to DOWN and makes the platform health check treat a perfectly
    # serving instance as unhealthy. Sign-in email actually goes out over the Brevo HTTPS API, so
    # SMTP reachability is not a readiness signal here.
    mail:
      enabled: false

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
